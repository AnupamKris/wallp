[package]
name = "wallp"
version = "0.1.0"
description = "A desktop UI that lives inside the Windows desktop, behind the icons"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wallp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
png = "0.18"
base64 = "0.22"
arboard = "3.6"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
futures = "0.3"
rand = "0.8"
url = "2"

# Keep this on the same major as the `windows` crate Tauri uses, so the HWND
# from `WebviewWindow::hwnd()` is the same type as ours.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
